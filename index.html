<!DOCTYPE html>
<html lang="nl-BE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
<title>Belgian TV guide</title>
<meta name="theme-color" content="#0C0C0D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#0C0C0D;--cell:#2C2C2E;--cell2:#3C3C40;--label:#38383B;--labsel:#C4C4C6;--ink:#F1F1F2;--muted:#A3A3A8;--accent:#FFA400;--line:#4A4A4E;
  --ppm:4px;--rowh:46px;--chw:92px;--axh:34px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
@media(min-width:760px){:root{--ppm:5px;--rowh:44px;--chw:150px}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:radial-gradient(1100px 420px at 72% -8%,#2B2B2F,transparent 60%),var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:0 12px 40px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 10px;border-bottom:2px solid;border-image:linear-gradient(90deg,transparent,#7A7A7E,transparent) 1}
.brand{display:flex;align-items:center;gap:10px;color:var(--accent);font-weight:800;font-size:1.3rem;letter-spacing:.02em}
.brand i{width:30px;height:30px;border-radius:7px;background:var(--accent);position:relative;display:block}
.brand i::after{content:"";position:absolute;inset:7px;border:3px solid #1A1200;border-radius:4px}
.when{display:flex;align-items:center;gap:10px}
.clock{font-size:2rem;font-weight:700;color:#D9D9DB;line-height:1}
.date{font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;line-height:1.2;color:#CFCFD2}
.detail{display:grid;grid-template-columns:1fr auto;gap:14px;padding:14px 0 8px}
.d-title{font-size:1.45rem;font-weight:800;color:var(--accent);line-height:1.15}
.d-sub{font-weight:700;margin-top:2px}
.d-desc{color:var(--muted);margin-top:2px;min-height:2.8em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prog{display:flex;align-items:center;gap:8px;margin-top:8px;max-width:420px;font-size:.85rem;font-weight:700;color:#D6D6D8}
.prog .bar{flex:1;height:7px;background:#5A5A5E}.prog .bar i{display:block;height:100%;background:var(--accent)}
.thumb{width:120px;height:80px;background:linear-gradient(160deg,#3B3B40,#18181A);border:1px solid #555;display:flex;align-items:center;justify-content:center;padding:10px;text-align:center;font-weight:800}
.thumb img{max-width:100%;max-height:100%;object-fit:contain}
@media(min-width:760px){.thumb{width:230px;height:140px}}
.thumb.pic{padding:0}.thumb.pic img{max-width:none;max-height:none;width:100%;height:100%;object-fit:cover}
.th{width:64px;height:40px;object-fit:cover;border-radius:3px;background:#333;flex:none}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn,button{font:inherit;font-size:.9rem;font-weight:600;color:var(--ink);background:var(--cell);border:1px solid var(--line);padding:7px 14px;border-radius:4px;cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover,button:hover{border-color:var(--accent)}
.btn.go,button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#1A1200}
:focus-visible{outline:3px solid #8FB4FF;outline-offset:2px}
.bar2{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
input[type=search]{flex:1 1 150px;min-width:0;font:inherit;color:var(--ink);background:var(--cell);border:1px solid var(--line);border-radius:4px;padding:8px 12px}
.day{display:flex;align-items:center;background:var(--cell);border:1px solid var(--line);border-radius:4px}
.day button{border:0;background:transparent;padding:7px 12px}.day span{min-width:5.5rem;text-align:center;font-weight:700}
.day button:disabled{opacity:.3;cursor:default}
.notice{margin-top:10px;padding:6px 10px;border-left:3px solid var(--accent);background:#17171A;font-size:.82rem;color:var(--muted)}
.grid{display:flex;margin-top:10px}
.chcol{flex:0 0 var(--chw);z-index:2}
.axspace{height:var(--axh)}
.chl{height:var(--rowh);display:flex;align-items:center;gap:8px;padding:0 8px;background:var(--label);border-bottom:1px solid #1A1A1C;font-weight:600;font-size:.95rem;overflow:hidden;cursor:pointer}
.chl.sel{background:var(--labsel);color:#111}
.chl .num{color:#D0D0D3;font-size:.8rem;min-width:1.7rem}.chl.sel .num{color:#333}
.chl .logo{max-height:calc(var(--rowh) - 14px);max-width:44px;object-fit:contain}
.cname{display:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nologo .cname{display:block}
@media(min-width:760px){.chl .logo{max-width:84px;max-height:calc(var(--rowh) - 10px)}}
@media(max-width:759px){[data-act="popup"]{display:none}.d-desc{min-height:0}.detail{padding-top:10px}input[type=search]{flex-basis:100%}.btn,button{padding:6px 12px}}
.scroller{flex:1 1 auto;min-width:0;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
.inner{position:relative}
.axis{height:var(--axh);position:relative;border-bottom:1px solid #1A1A1C}
.tick{position:absolute;top:0;height:100%;border-left:1px solid #555;padding:7px 0 0 6px;font-size:.85rem;font-weight:700;color:#D6D6D8;white-space:nowrap}
.rowx{height:var(--rowh);position:relative;border-bottom:1px solid #1A1A1C;background:#202022}
.nod{position:absolute;left:10px;top:0;line-height:var(--rowh);font-size:.85rem;color:var(--muted)}
.blk{position:absolute;top:2px;height:calc(var(--rowh) - 4px);display:block;padding:0 8px;border:0;border-radius:0;text-align:left;font-weight:500;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk:hover{background:var(--cell2)}.blk.on{background:#4B4B4F}.blk.past{opacity:.6}
.blk.sel{background:var(--accent);color:#1A1200;font-weight:700;opacity:1}
.now{position:absolute;top:0;bottom:0;width:3px;background:#fff;z-index:3;pointer-events:none}
.lib{margin-top:10px;background:#202022;border:1px solid var(--line);border-radius:6px}
.item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid #1A1A1C}
.item:last-child{border-bottom:0}.item .ttl{flex:1;font-weight:600}.item .t{color:var(--muted);font-weight:400;font-size:.8rem}
.tag{font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:3px;background:var(--cell2)}
.empty{padding:20px 4px;color:var(--muted)}
dialog#vault{background:#17171A;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:16px;width:min(560px,94vw);max-height:88vh;overflow:auto}
dialog#vault::backdrop{background:rgba(0,0,0,.75)}
.vhead{display:flex;justify-content:space-between;align-items:center;gap:10px}.vhead h2{margin:0;font-size:1.2rem;color:var(--accent)}
.vnote{color:var(--muted);font-size:.88rem;margin:10px 0 0}
#vaultbox label{display:block;margin-top:10px;font-size:.85rem;color:var(--muted)}
#vaultbox input{display:block;width:100%;margin-top:4px;font:inherit;color:var(--ink);background:var(--cell);border:1px solid var(--line);border-radius:4px;padding:8px 10px}
.pw{display:flex;gap:6px;align-items:center;margin-top:4px}.pw input{flex:1;margin-top:0!important}
.vcard{border-top:1px solid var(--line);margin-top:14px;padding-top:6px}.vcard.focus{border-top:2px solid var(--accent)}
.vcard h3{margin:8px 0 0;font-size:1rem}.vok{font-size:.72rem;font-weight:700;color:#1A1200;background:var(--accent);border-radius:3px;padding:1px 6px;margin-left:6px}
.vfoot{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.vmsg{min-height:1.4em;color:var(--accent);font-size:.88rem;margin:10px 0 0}
.iconbtn{background:transparent;border:0;padding:4px;color:#D9D9DB;line-height:0;border-radius:50%;cursor:pointer}
.iconbtn svg{width:36px;height:36px;display:block}
.iconbtn:hover,.iconbtn.unlocked{color:var(--accent)}
@media(max-width:480px){.clock{font-size:1.6rem}.date{font-size:.62rem}.when{gap:6px}.brand{font-size:1.1rem;gap:8px}.iconbtn{padding:2px}.iconbtn svg{width:30px;height:30px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><i></i>TV-GIDS</div>
    <div class="when"><div class="clock" id="clock"></div><div class="date" id="date"></div><button id="vaultbtn" class="iconbtn" aria-label="Accounts" title="Accounts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10.5"/><circle cx="12" cy="9.6" r="3.6"/><path d="M5.3 19.3c1.5-3 3.9-4.6 6.7-4.6s5.2 1.6 6.7 4.6"/></svg></button></div>
  </header>
  <section class="detail" id="detail"></section>
  <div class="bar2">
    <input type="search" id="q" placeholder="Zoek een programma" aria-label="Zoek een programma">
    <div class="day"><button id="dprev" aria-label="Vorige dag">‹</button><span id="dlabel"></span><button id="dnext" aria-label="Volgende dag">›</button></div>
    <button id="nowbtn">Nu</button>
    <a class="btn" target="_blank" rel="noopener noreferrer" href="https://www.netflix.com/be/">Netflix</a>
  </div>
  <div class="bar2" id="chips" role="group" aria-label="Filter op dienst"></div>
  <div class="notice" id="notice">Gids laden…</div>
  <div id="view"></div>
</div>

<dialog id="vault" aria-label="Accounts"><div id="vaultbox"></div></dialog>
<script src="app.js"></script>
</body>
</html>
